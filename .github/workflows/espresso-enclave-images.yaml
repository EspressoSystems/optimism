# Builds and publishes the Espresso enclave images for the OP batcher to GHCR:
#
#   ghcr.io/espressosystems/optimism/op-batcher-enclave-app
#   ghcr.io/espressosystems/optimism/op-batcher-tee
#
# These are consumed by EspressoSystems/tee-image-builder's nitro-op-poster
# workflow, which wraps op-batcher-enclave-app into an AWS Nitro EIF and
# extracts enclave-tools from op-batcher-tee. Both images must share a tag;
# pushes to espresso/batcher publish the branch-slug tag "espresso-batcher"
# plus a SHA-suffixed tag for pinning.
#
# Note: the workflow_dispatch button only appears in the GitHub UI once this
# file also exists on the default branch; push/pull_request triggers work
# from espresso/batcher directly.

name: Build and Push Espresso Enclave Images

on:
  push:
    branches:
      - "espresso/batcher"
  pull_request:
    branches:
      - "espresso/batcher"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/espressosystems/optimism

jobs:
  # amd64-only — Nitro enclave requirement
  build-op-batcher-enclave-app:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/op-batcher-enclave-app
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-,enable=${{ github.event_name == 'push' }}

      - name: Build and push OP Batcher Enclave App
        uses: docker/build-push-action@v5
        with:
          context: .
          file: espresso/docker/op-stack/Dockerfile
          target: op-batcher-enclave-app
          platforms: linux/amd64
          # PRs from forks have a read-only GITHUB_TOKEN and cannot push.
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TARGET_BASE_IMAGE=alpine:3.22
            TARGETOS=linux
            TARGETARCH=amd64
            GIT_COMMIT=${{ github.sha }}

  # amd64-only — Nitro enclave requirement
  build-op-batcher-tee:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/op-batcher-tee
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-,enable=${{ github.event_name == 'push' }}

      - name: Build and push OP Batcher TEE
        uses: docker/build-push-action@v5
        with:
          context: .
          file: espresso/docker/op-stack/Dockerfile
          target: op-batcher-enclave-target
          platforms: linux/amd64
          # PRs from forks have a read-only GITHUB_TOKEN and cannot push.
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TARGET_BASE_IMAGE=alpine:3.22
            TARGETOS=linux
            TARGETARCH=amd64
            GIT_COMMIT=${{ github.sha }}
